<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qfy-agent · 接入演示台</title>
<link rel="stylesheet" href="/static/style.css?v=20260818-2">
<script defer src="/static/app.js?v=20260818-2"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="demoApp()" x-init="init()">

<header class="topbar">
  <div class="brand">
    <span class="logo">▣</span>
    <div>
      <h1>qfy-agent 接入演示台</h1>
      <p class="sub">模拟财务系统接入 · OpenAI 兼容网关 · 本地模型（LM Studio）</p>
    </div>
  </div>
  <div class="top-actions">
    <label class="field inline">
      <span>模型</span>
      <select x-model="model" @change="loadAudit()" :disabled="busy || !models.length" aria-label="模型">
        <template x-for="m in models" :key="m.id">
          <option :value="m.id" x-text="m.id + ' (' + m.tool_calling + ')'"></option>
        </template>
      </select>
    </label>
    <label class="switch">
      <input type="checkbox" x-model="useTool">
      <span>工具演示（map_column）</span>
    </label>
    <label class="switch">
      <input type="checkbox" x-model="thinking">
      <span>思考</span>
    </label>
    <a class="btn ghost" href="/v1/models" target="_blank">OpenAI 端点</a>
  </div>
</header>

<main class="layout">
  <!-- 左栏：对话 -->
  <section class="panel chat-panel">
    <div class="panel-head">
      <h2>对话</h2>
      <div class="chat-controls">
        <span class="hint" x-show="useTool">工具循环完成后模拟 SSE 输出</span>
        <div class="segmented" aria-label="响应方式">
          <button type="button" :class="{active: streamMode}" @click="streamMode = true" :disabled="busy">SSE 流式</button>
          <button type="button" :class="{active: !streamMode}" @click="streamMode = false" :disabled="busy">完整响应</button>
        </div>
      </div>
    </div>
    <div class="chat-log" id="chat-log" x-ref="chatLog">
      <template x-for="(msg, i) in messages" :key="i">
        <div class="msg" :class="'role-' + msg.role">
          <div class="msg-meta">
            <div class="msg-label" x-text="msgLabel(msg.role)"></div>
            <span class="transport-tag" x-show="msg.transport"
                  x-text="msg.transport.includes('SSE') ? msg.transport + ' · ' + msg.chunkCount : msg.transport"></span>
          </div>
          <div class="msg-body">
            <template x-if="msg.toolCalls && msg.toolCalls.length">
              <div class="tool-call">
                <template x-for="(tc, j) in msg.toolCalls" :key="j">
                  <pre x-text="'工具调用: ' + tc.function.name + ' ' + tc.function.arguments"></pre>
                </template>
              </div>
            </template>
            <div x-text="msg.content" class="msg-content" :class="{streaming: msg.streaming}"></div>
          </div>
        </div>
      </template>
    </div>
    <form class="composer" @submit.prevent="send()">
      <textarea x-model="draft" rows="2" placeholder="输入消息，例如：请把列「客户名称」映射到标准字段，调用工具"
                @keydown.enter.exact.prevent="send()"></textarea>
      <button class="btn primary send-btn" type="submit" :disabled="busy || !model || !draft.trim()" x-text="busy ? '生成中' : '发送'"></button>
    </form>
    <div class="suggestions">
      <template x-for="s in suggestions" :key="s">
        <button class="chip" type="button" @click="draft = s; send()" x-text="s"></button>
      </template>
    </div>
  </section>

  <!-- 右栏：模型 + 审计 -->
  <aside class="side">
    <section class="panel">
      <div class="panel-head">
        <h2>模型能力</h2>
        <button class="btn ghost sm" type="button" @click="loadModels()" :disabled="busy">刷新</button>
      </div>
      <div id="model-list" class="model-list" x-html="modelsHTML()"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>工具演示</h2>
      </div>
      <div class="tool-box">
        <p class="hint">map_column：模拟“已确认映射”查询。模型优先使用原生 tool_calls，结构异常时由网关降级处理，并自动执行与回填。</p>
        <pre class="code">已确认映射表（模拟）:
  客户名称 → customer_name
  金额 → amount
  数量 → quantity
  日期 → order_date</pre>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>审计留痕</h2>
        <button class="btn ghost sm" type="button" @click="loadAudit()">刷新</button>
      </div>
      <div id="audit-list" class="audit-list"></div>
    </section>
  </aside>
</main>

</body>
</html>
